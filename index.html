<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MQ2 Monitor</title>

  <!-- ERa Widget SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@eohjsc/era-widget@1.1.3/src/index.js"></script>

  <style>
    body{
      margin:0;
      font-family: Arial, Helvetica, sans-serif;
      background:#0b1020;
      color:white;
      padding:16px;
    }
    .card{
      max-width:600px;
      margin:auto;
      background:rgba(255,255,255,0.06);
      border:1px solid rgba(255,255,255,0.15);
      border-radius:16px;
      padding:16px;
    }
    .row{
      display:flex;
      justify-content:space-between;
      align-items:center;
      gap:10px;
      flex-wrap:wrap;
    }
    .title{
      font-size:18px;
      font-weight:bold;
    }
    .status{
      font-size:13px;
      padding:6px 10px;
      border-radius:999px;
      background:rgba(255,255,255,0.08);
      border:1px solid rgba(255,255,255,0.15);
    }
    .big{
      font-size:48px;
      font-weight:900;
      margin:14px 0 6px 0;
    }
    .muted{
      color:rgba(255,255,255,0.65);
      font-size:13px;
    }
    .pill{
      padding:8px 12px;
      border-radius:999px;
      font-weight:bold;
      display:inline-block;
      margin-top:12px;
      background:rgba(57,255,136,0.15);
      border:1px solid rgba(57,255,136,0.35);
    }
    .pill.danger{
      background:rgba(255,59,59,0.15);
      border:1px solid rgba(255,59,59,0.35);
    }
    .bar{
      position:relative;
      height:16px;
      border-radius:999px;
      background:rgba(255,255,255,0.12);
      overflow:hidden;
      margin-top:14px;
      border:1px solid rgba(255,255,255,0.15);
    }
    .fill{
      height:100%;
      width:0%;
      background:linear-gradient(90deg,#39ff88,#ffb020,#ff3b3b);
      transition:width .2s ease;
    }
    .thr{
      position:absolute;
      top:-6px;
      width:2px;
      height:28px;
      background:white;
      opacity:0.8;
    }
    .footer{
      margin-top:12px;
      font-size:12px;
      color:rgba(255,255,255,0.6);
      line-height:1.5;
    }
  </style>
</head>

<body>
  <div class="card">

    <div class="row">
      <div class="title">MQ2 Smoke Monitor</div>
      <div class="status" id="connText">Waiting ERa...</div>
    </div>

    <div class="big" id="adcTxt">—</div>
    <div class="muted">Smoke ADC (V1) | Threshold: 1200</div>

    <div class="bar">
      <div class="fill" id="fill"></div>
      <div class="thr" id="thrLine"></div>
    </div>

    <div class="pill" id="smokePill">SAFE (V3 = 0)</div>

    <div class="footer">
      ✅ iFrame Widget ERa cần 2 Realtime Configs theo đúng thứ tự:<br/>
      1) V1 (Smoke ADC) <br/>
      2) V3 (Smoke Detected)
    </div>
  </div>

  <script>
    const THR = 1200;
    const MAX = 4095;

    const adcTxt = document.getElementById("adcTxt");
    const connText = document.getElementById("connText");
    const fill = document.getElementById("fill");
    const thrLine = document.getElementById("thrLine");
    const smokePill = document.getElementById("smokePill");

    // threshold line fixed position
    thrLine.style.left = ((THR / MAX) * 100) + "%";

    function setUI(adc, detected){
      adc = Number(adc || 0);
      detected = !!detected;

      adcTxt.textContent = adc;

      const pct = Math.min(100, Math.max(0, (adc / MAX) * 100));
      fill.style.width = pct.toFixed(1) + "%";

      if(detected || adc > THR){
        smokePill.classList.add("danger");
        smokePill.textContent = "SMOKE! (V3 = 1)";
      }else{
        smokePill.classList.remove("danger");
        smokePill.textContent = "SAFE (V3 = 0)";
      }
    }

    // ERa Widget SDK
    window.eraWidget.init({
      onConfiguration: () => {
        connText.textContent = "Connected";
      },
      onValues: (values) => {
        connText.textContent = "Connected";

        let v = [];
        if(Array.isArray(values)){
          if(typeof values[0] === "number") v = values;
          else v = values.map(x => Number(x?.value ?? 0));
        } else if(values?.values && Array.isArray(values.values)){
          v = values.values.map(x => Number(x ?? 0));
        }

        // IMPORTANT order:
        // index 0: V1 (Smoke ADC)
        // index 1: V3 (Smoke Detected)
        const smokeAdc = Number(v[0] ?? 0);
        const smokeDet = Number(v[1] ?? 0) === 1;

        setUI(smokeAdc, smokeDet);
      }
    });
  </script>
</body>
</html>
